apiVersion: apps/v1
kind: Deployment

metadata:
  name: pipeline-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pipeline

  template:
    metadata:
      labels:
        app: pipeline

    spec:
      containers:
        - name: pipeline-container
          image: docadityaa/adirepo:1.0
          ports:
            - containerPort: 8080